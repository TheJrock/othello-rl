# 6×6 defaults (spec §4.5). exp / target / sampling / seed come from the command line:
#   python -m othello_rl.train --config configs/6x6.yaml --exp e2-6x6 --target env --sampling pool --seed 0
board: 6

# network
channels: 64
layers: 4

# self-play and replay
games: 400000            # E2's budget (decided Nov 25 from the pilots, spec §4.8): the pilots plateaued by ~100k with no decline to 400k; 400k keeps the config they validated. ~16.5 h for E2's 12 runs, 4 at a time
parallel_games: 256
replay_capacity: 1280000    # ~10% of training's transitions (400k games × 32, both sides, spec D2); ~340 MB
augment: true

# optimisation
batch_size: 256
lr: 0.0003
transitions_per_grad_step: 16
target_update_every: 250   # was 1000 until Nov 24 (spec §4.5)
grad_clip: 10.0

# exploration (both players)
eps_start: 1.0
eps_end: 0.1               # was 0.05 until Nov 24 (spec §4.5)
eps_decay_frac: 0.2

# opponent pool (sampling: pool only)
pool_groups: 8
pool_p_latest: 0.5

# evaluation and checkpoints
eval_every: 10000        # 41 eval points / pool snapshots; keep ~40 if `games` changes
openings: data/openings_6x6.json
solver_table: null
endgame_set: data/endgame6.jsonl  # built Nov 24 (spec §4.4). The 6×6 pilots ran without it; backfill theirs from checkpoints
