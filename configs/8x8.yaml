# 8×8 defaults (spec §4.5). A gated add-on, not part of the 2×2 (spec D9, §4.8): the env pair only,
# one seed each. Run it on a GPU, e.g.
#   python -m othello_rl.train --config configs/8x8.yaml --exp e6-8x8 --target env --sampling pool --seed 0 --device mps
board: 8

# network
channels: 64
layers: 5

# self-play and replay
games: 1000000           # gate 1 (Nov 24): ~18 h alone on the laptop GPU. E6's budget is set at gate 2 from P8's curve (spec §4.8)
parallel_games: 256
replay_capacity: 6000000 # ~10% of training's transitions (1M games × 60, both sides, spec D1, D2); ~2.8 GB; rescale if `games` changes
augment: true

# optimisation
batch_size: 256
lr: 0.0003
transitions_per_grad_step: 16
target_update_every: 250   # was 1000 until Nov 24 (spec §4.5)
grad_clip: 10.0

# exploration (both players)
eps_start: 1.0
eps_end: 0.1               # was 0.05 until Nov 24 (spec §4.5)
eps_decay_frac: 0.2

# opponent pool (sampling: pool only)
pool_groups: 8
pool_p_latest: 0.5

# evaluation and checkpoints
eval_every: 20000        # 51 eval points / pool snapshots; keep ~50 if `games` changes
openings: data/openings_8x8.json
solver_table: null
endgame_set: null
