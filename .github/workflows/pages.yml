name: deploy-demo

# Builds web/ and deploys it to GitHub Pages (spec §5.5).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Until then, run it manually from the Actions tab. Once Pages is configured (target: Dec 3–5),
# uncomment `push` to deploy on every change to web/.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["web/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
